name: Grynvault Rebalance macOS candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to build
        required: true
        type: string
      build_release:
        description: Sign and notarize a private release candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: grynvault-rebalance-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APP_NAME: Grynvault Rebalance
      APP_PATH: build/bin/Grynvault Rebalance.app
      DMG_PATH: build/out/Grynvault-Rebalance-macOS-universal-candidate.dmg
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable source selection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "release tag contains unsupported characters" >&2
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_commit" = "$tag_commit"
          test -z "$(git status --porcelain=v1)"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          go mod download

      - name: Run non-paying tests and security checks
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release/check-source-boundaries.sh
          go test ./service ./wails
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --no-banner --redact=100

      - name: Build unsigned candidate from the tag
        shell: bash
        run: ./scripts/release/build-macos.sh "$RELEASE_TAG"

      - name: Inspect unsigned candidate
        shell: bash
        run: >-
          ./scripts/release/inspect-macos.sh
          "$APP_PATH"
          "$RELEASE_TAG"
          "${{ steps.source.outputs.commit }}"

      - name: Validate signing inputs
        if: inputs.build_release
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.GRYNVAULT_APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GRYNVAULT_APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.GRYNVAULT_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.GRYNVAULT_APPLE_TEAM_ID }}
          APPLE_USERNAME: ${{ secrets.GRYNVAULT_APPLE_USERNAME }}
          SIGNING_IDENTITY: ${{ secrets.GRYNVAULT_APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for required in CERTIFICATE CERTIFICATE_PASSWORD APPLE_PASSWORD APPLE_TEAM_ID APPLE_USERNAME SIGNING_IDENTITY; do
            if [[ -z "${!required}" ]]; then
              echo "missing required Grynvault signing input: $required" >&2
              exit 1
            fi
          done

      - name: Import Grynvault signing certificate
        if: inputs.build_release
        uses: Apple-Actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.GRYNVAULT_APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.GRYNVAULT_APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Sign and inspect the application
        if: inputs.build_release
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.GRYNVAULT_APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/Frameworks/libldk_node.dylib"
          codesign --force --timestamp --options runtime --entitlements build/darwin/entitlements.plist --sign "$SIGNING_IDENTITY" "$APP_PATH"
          ./scripts/release/inspect-macos.sh "$APP_PATH" "$RELEASE_TAG" "${{ steps.source.outputs.commit }}" --require-developer-id

      - name: Create, notarize, and staple the candidate disk image
        if: inputs.build_release
        shell: bash
        env:
          APPLE_PASSWORD: ${{ secrets.GRYNVAULT_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.GRYNVAULT_APPLE_TEAM_ID }}
          APPLE_USERNAME: ${{ secrets.GRYNVAULT_APPLE_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p build/out
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_USERNAME" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"

      - name: Archive unsigned internal evidence
        if: ${{ !inputs.build_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/out
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build/out/UNSIGNED-INTERNAL-Grynvault-Rebalance-${RELEASE_TAG}.zip"

      - name: Upload unsigned internal evidence
        if: ${{ !inputs.build_release }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UNSIGNED-INTERNAL-Grynvault-Rebalance-${{ inputs.release_tag }}-${{ steps.source.outputs.commit }}
          path: build/out/UNSIGNED-INTERNAL-Grynvault-Rebalance-${{ inputs.release_tag }}.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload private signed candidate
        if: inputs.build_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PRIVATE-CANDIDATE-Grynvault-Rebalance-${{ inputs.release_tag }}-${{ steps.source.outputs.commit }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
          if-no-files-found: error
          retention-days: 7
