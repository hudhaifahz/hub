name: Backend testing with Postgres

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  test-postgres:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17.2
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: albyhub
          POSTGRES_USER: alby
          POSTGRES_PASSWORD: albytest123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        name: Check out code
        with:
          persist-credentials: false

      - name: Setup GoLang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "./go.mod"

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        env:
          TEST_DATABASE_URI: "postgresql://alby:albytest123@localhost:5432/albyhub"
          TEST_DB_MIGRATE_POSTGRES_URI: "postgresql://alby:albytest123@localhost:5432/albyhub"
        run: mkdir frontend/dist && touch frontend/dist/tmp && go test ./...
