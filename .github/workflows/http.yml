name: Grynvault source compatibility checks

on:
  push:
    branches:
      - codex/grynvault-rebalance-release
      - codex/grynvault-rebalance-rc3-prep
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # The first Grynvault release supports universal macOS only. The pinned Go
    # binding includes the reviewed exact-channel native library for macOS;
    # upstream Linux libraries do not yet expose those symbols.
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install pinned tools and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          go mod download
          cd frontend
          yarn install --frozen-lockfile

      - name: Check frontend and release workflows
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release/check-source-boundaries.sh
          ./scripts/release/test-release-scripts.sh
          cd frontend
          yarn prepare:http
          yarn lint:js
          yarn tsc:compile
          yarn format
          yarn build:http
          yarn audit --groups dependencies
          cd ..
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Run Go tests and security checks
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./api ./wails
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . --no-banner --redact=100
