services:
  - type: web
    runtime: image
    name: albyhub
    image:
      url: ghcr.io/getalby/hub:latest
    numInstances: 1
    region: frankfurt # Default: oregon
    plan: starter
    disk:
      name: data
      mountPath: /data
      sizeGB: 2
    autoDeploy: false
    envVars:
      - key: WORK_DIR
        value: /data/albyhub
      - key: LN_BACKEND_TYPE
        value: PHOENIX
      - key: PHOENIXD_AUTHORIZATION
        sync: false # Enter the same new random value for both services.
      - key: PHOENIXD_ADDRESS
        fromService:
          name: phoenixd
          type: pserv
          property: hostport
  - type: pserv
    runtime: image
    name: phoenixd
    image:
      url: ghcr.io/sethforprivacy/phoenixd:latest
    numInstances: 1
    region: frankfurt # Default: oregon
    plan: starter
    disk:
      name: data
      mountPath: /data
      sizeGB: 2
    autoDeploy: false
    dockerCommand: /bin/sh -c 'exec /phoenix/bin/phoenixd --agree-to-terms-of-service --http-bind-ip 0.0.0.0 --http-password="$PHOENIXD_AUTHORIZATION"'
    envVars:
      - key: PHOENIX_DATADIR
        value: /data/phoenixd
      - key: PHOENIXD_AUTHORIZATION
        sync: false # Enter the same new random value for both services.
